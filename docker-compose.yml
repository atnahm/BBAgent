version: '3.8'

services:
  # 1. Background Automation Worker
  worker:
    build: .
    container_name: bbagent-worker
    restart: unless-stopped
    volumes:
      - data:/app/data
      - temp:/app/temp
      - ./backend/.env:/app/backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python automate.py
    networks:
      - biz-agent-network

  # 2. Flask API
  api:
    build: .
    container_name: bbagent-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - data:/app/data
      - temp:/app/temp
      - ./backend/.env:/app/backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python webhook_server.py
    networks:
      - biz-agent-network

  # 3. Streamlit UI
  ui:
    build: .
    container_name: bbagent-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - data:/app/data
      - temp:/app/temp
      - ./backend/.env:/app/backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run frontend/app.py --server.address=0.0.0.0
    networks:
      - biz-agent-network

  # 4. Vector DB (ChromaDB)
  chroma:
    image: chromadb/chroma:latest
    container_name: bbagent-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - data:/chroma/chroma
    networks:
      - biz-agent-network

networks:
  biz-agent-network:
    driver: bridge

volumes:
  data:
  temp:
