llm:
  provider: "huggingface" # Options: "gemini" or "huggingface"

  # Gemini configuration
  gemini:
    model: "gemini-1.5-flash-latest"
    api_key: "${GEMINI_API_KEY}"
    temperature: 0.3
    max_tokens: 2048

  # HuggingFace configuration
  huggingface:
    model: "Qwen/Qwen2.5-VL-7B-Instruct"
    api_key: "${HUGGINGFACE_API_KEY}"
    use_local: false # true = local GPU inference, false = API
    temperature: 0.3
    max_tokens: 2048

  # Local Offline Inference (e.g., Ollama or vLLM)
  local:
    endpoint_url: "${LOCAL_LLM_ENDPOINT}" # e.g., http://localhost:11434/api/generate
    model: "llama3"
    api_key: "none"
    temperature: 0.3
    max_tokens: 2048

vector_db:
  type: "chromadb"
  path: "${CHROMA_DB_PATH}"
  collection_name: "biz_agent_memory"

relational_db:
  type: "sqlite"
  path: "${DATABASE_PATH}"

whatsapp:
  mock_mode: ${WHATSAPP_MOCK_MODE}
  api_key: "${WHATSAPP_API_KEY}"
  phone_number_id: "${WHATSAPP_PHONE_NUMBER_ID}"
  business_account_id: "${WHATSAPP_BUSINESS_ACCOUNT_ID}"
  test_number: "${WHATSAPP_TEST_NUMBER}"

gstin:
  mock_mode: ${GSTIN_MOCK_MODE}
  api_key: "${GST_API_KEY}"

compliance:
  msmed_act:
    payment_limit_days: 45
    interest_multiplier: 3
    bank_rate_percent: 6.5
  section_43b_h: true

safety:
  require_hitl_for: ["legal_notice", "high_value"]
  high_value_threshold: 50000
  fraud_detection_enabled: true

api:
  secret_key: "${API_SECRET_KEY}"

ui:
  auth_enabled: false
  username: "${UI_USERNAME}"
  password: "${UI_PASSWORD}"

automation:
  auto_approve_limit: ${AUTO_APPROVE_LIMIT}

ingestion:
  email:
    enabled: false
    imap_server: "${IMAP_SERVER}"
    username: "${IMAP_USERNAME}"
    password: "${IMAP_PASSWORD}"
  database:
    enabled: false
    connection_string: "${EXTERNAL_DB_CONNECTION}"
    query: "${EXTERNAL_DB_QUERY}"

# AI Models for Agent Enhancement
ai_models:
  huggingface:
    api_key: "${HUGGINGFACE_API_KEY}"
    timeout: 30
    max_retries: 3
    fallback_to_rules: true

    # Model assignments for each agent
    models:
      compliance_llm: "meta-llama/Llama-3.2-3B-Instruct"
      collector_llm: "meta-llama/Llama-3.2-3B-Instruct"
      arbitrator_llm: "mistralai/Mistral-7B-Instruct-v0.3"

    # Generation parameters
    temperature: 0.7
    max_tokens: 500
